function orientationFlipped(){
  return state.settings.orientation === 'black';
}
function sqToXY(sq){
  let file = sq & 7, rank = sq >> 3;
  let col = file, row = rank;
  if (orientationFlipped()){ col = 7-file; row = 7-rank; }
  return { col, row };
}
function xyToSq(col, row){
  let file = col, rank = row;
  if (orientationFlipped()){ file = 7-col; rank = 7-row; }
  return rank*8 + file;
}

function buildBoardSquares(){
  boardEl.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let row=0; row<8; row++){
    for (let col=0; col<8; col++){
      const sq = xyToSq(col,row);
      const light = ((sq>>3)+(sq&7))%2===0;
      const div = document.createElement('div');
      div.className = 'sq' + (light? '' : ' dark');
      div.dataset.sq = sq;
      div.setAttribute('role','gridcell');
      frag.appendChild(div);
    }
  }
  boardEl.appendChild(frag);
  renderCoords();
}
function renderCoords(){
  coordsEl.innerHTML = '';
  const flipped = orientationFlipped();
  for (let i=0;i<8;i++){
    const file = flipped ? 7-i : i;
    const bottomRank = flipped ? 7 : 0;
    const f = document.createElement('span');
    f.className='coord file' + (((file + bottomRank) % 2 === 0) ? ' on-dark' : '');
    f.textContent = 'abcdefgh'[file];
    f.style.left = ((i+0.94)/8*100)+'%';
    coordsEl.appendChild(f);
    const rank = flipped ? i+1 : 8-i;
    const leftFile = flipped ? 7 : 0;
    const r = document.createElement('span');
    r.className='coord rank' + ((((rank-1) + leftFile) % 2 === 0) ? ' on-dark' : '');
    r.textContent = rank;
    r.style.top = ((i+0.14)/8*100)+'%';
    coordsEl.appendChild(r);
  }
}

function squareEl(sq){ return boardEl.querySelector(`.sq[data-sq="${sq}"]`); }

let pieceElMap = new Map();

function currentPosition(){

  if (state.mode === 'editor') return state.editorBoard;
  if (!state.game) return null;
  if (state.viewPly === state.game.history.length) return state.game.pos;

  const g = state.game;
  const p = new Position(g.startFen);
  for (let i=0;i<state.viewPly;i++) p.makeMove(g.history[i].move);
  return p;
}

function renderPieces(animate=true){
  const pos = currentPosition();
  if (!pos) return;
  const speed = state.settings.animSpeed;
  const animOn = speed !== 'off' && !state.settings.reducedMotion;
  const seen = new Set();
  for (let sq=0; sq<64; sq++){
    const p = pos.board[sq];
    if (!p) continue;
    seen.add(sq);
    let el = pieceElMap.get(sq);
    const needSvg = !el || el.dataset.piece !== p || el.dataset.setName !== state.settings.pieceSet;
    if (!el){
      el = document.createElement('div');
      el.className = 'pc';
      el.dataset.sq = sq;
      piecesEl.appendChild(el);
      pieceElMap.set(sq, el);
      if (animate && animOn) el.classList.add('spawn');
    }
    if (needSvg){
      el.innerHTML = pieceSvg(p, state.settings.pieceSet);
      el.dataset.piece = p;
      el.dataset.setName = state.settings.pieceSet;
    }
    el.dataset.color = (p===p.toUpperCase())? 'w':'b';
    positionPieceEl(el, sq);
  }
  for (const [sq, el] of Array.from(pieceElMap.entries())){
    if (!seen.has(sq)){ el.remove(); pieceElMap.delete(sq); }
  }
}
function positionPieceEl(el, sq){
  const {col,row} = sqToXY(sq);
  el.style.transform = `translate(${col*100}%, ${row*100}%)`;
  el.style.left='0'; el.style.top='0';
}

function animateMove(fromSq, toSq, isCapture, cb){
  const speed = state.settings.animSpeed;
  const animOn = speed !== 'off' && !state.settings.reducedMotion;
  const el = pieceElMap.get(fromSq);
  if (!el || !animOn){ cb && cb(); return; }
  const capturedEl = pieceElMap.get(toSq);
  if (capturedEl && capturedEl !== el){
    capturedEl.classList.add('captured-out');
    const {col,row} = sqToXY(fromSq);
    capturedEl.style.setProperty('--pc-tf', `translate(${sqToXY(toSq).col*100}%, ${sqToXY(toSq).row*100}%)`);
    setTimeout(()=>{ capturedEl.remove(); pieceElMap.delete(toSq); }, 260);
  }
  pieceElMap.delete(fromSq);
  el.dataset.sq = toSq;
  pieceElMap.set(toSq, el);
  const durMap = { slow:280, normal:180, fast:100 };
  el.style.transitionDuration = (durMap[speed]||180)+'ms';
  positionPieceEl(el, toSq);
  el.classList.add('moving');
  setTimeout(()=>{ el.classList.remove('moving'); el.style.transitionDuration=''; cb && cb(); },
    (durMap[speed]||180) + 20);
}

function clearHighlights(){
  boardEl.querySelectorAll('.sq').forEach(s=>{
    delete s.dataset.hl; delete s.dataset.check; delete s.dataset.threat; delete s.dataset.movable;
  });
  piecesEl.querySelectorAll('.hint-dot,.hint-ring').forEach(h=>h.remove());
}

function renderHighlights(){
  clearHighlights();
  const pos = currentPosition();
  if (!pos) return;

  if (state.settings.lastMoveHighlight && state.lastMove && state.viewPly === (state.game? state.game.history.length: 0)){
    const fe = squareEl(state.lastMove.from), te = squareEl(state.lastMove.to);
    const hl = state.lastMove.capture ? 'last-capture' : 'last';
    if (fe) fe.dataset.hl=hl;
    if (te) te.dataset.hl=hl;
  }

  if (state.selected >= 0){
    const se = squareEl(state.selected);
    if (se) se.dataset.hl='sel';
    if (state.settings.legalHints){
      for (const m of state.legalTargets){
        const te = squareEl(m.to);
        if (!te) continue;
        const dot = document.createElement('div');
        dot.className = m.captured || m.flags==='e' ? 'hint-ring' : 'hint-dot';
        const {col,row} = sqToXY(m.to);
        dot.style.left = ((col+0.5)/8*100)+'%';
        dot.style.top = ((row+0.5)/8*100)+'%';
        dot.style.transform='translate(-50%,-50%)';
        dot.style.width = dot.style.height = (100/8)+'%';
        piecesEl.appendChild(dot);
      }
    }
  }

  if (state.settings.checkHighlight && pos.inCheck && pos.inCheck()){
    const ks = pos.kingSquare(pos.turn);
    const ke = squareEl(ks);
    if (ke) ke.dataset.check = '1';
  }

  if (state.settings.highlightThreats){
    const mySide = pos.turn;
    for (let sq=0; sq<64; sq++){
      const p = pos.board[sq];
      if (p && colorOf(p)===mySide && pos.isAttacked(sq, other(mySide))){
        const e = squareEl(sq); if (e) e.dataset.threat='1';
      }
    }
  }
}

function fullBoardRender(animate=false){
  buildBoardSquares();
  pieceElMap = new Map();
  piecesEl.innerHTML = '';
  renderPieces(animate);
  renderHighlights();
  boardWrapEl.dataset.coords = state.settings.coordinates ? '1':'0';
  boardEl.dataset.hints = state.settings.legalHints ? '1':'0';
  const evalbar = document.getElementById('evalbar');
  evalbar.dataset.flip = orientationFlipped() ? '1':'0';
}

function isReviewingHistory(){
  return state.game && state.viewPly !== state.game.history.length;
}
function humanTurnAllowed(){
  if (state.mode === 'analysis' || state.mode === 'editor') return false;
  if (isReviewingHistory()) return false;
  if (state.result) return false;
  if (state.mode === 'ai' && state.game.turn() === state.aiSide) return false;
  if (state.mode === 'puzzle') return state.puzzleSolveState === 'solving';
  return true;
}

function trySelect(sq){
  const pos = currentPosition();
  if (!pos) return;
  const p = pos.board[sq];
  if (state.selected === sq){ state.selected=-1; state.legalTargets=[]; renderHighlights(); return; }
  if (p && colorOf(p) === pos.turn){
    state.selected = sq;
    state.legalTargets = pos.legalMoves(sq);
    renderHighlights();
    Audio1.play('click');
  } else if (state.selected >= 0) {
    attemptMove(state.selected, sq);
  } else {
    state.selected=-1; state.legalTargets=[]; renderHighlights();
  }
}

function attemptMove(from, to){
  const pos = currentPosition();
  const cands = pos.legalMoves(from).filter(m=>m.to===to);
  if (!cands.length){
    Audio1.play('illegal');
    flashInvalid(to);
    state.selected=-1; state.legalTargets=[]; renderHighlights();
    return false;
  }
  if (cands.length > 1 && cands[0].promotion){
    state.selected=-1; state.legalTargets=[]; renderHighlights();
    openPromotionPicker(from, to, pos.turn, (promo)=>{
      const m = cands.find(c=>c.promotion===promo);
      commitMove(m);
    });
    return true;
  }
  if (state.settings.moveConfirm){
    state.selected=-1;
    pendingConfirm = cands[0];
    renderHighlights();
    confirmMoveUI(cands[0]);
    return true;
  }
  state.selected=-1; state.legalTargets=[];
  commitMove(cands[0]);
  return true;
}
let pendingConfirm = null;
function confirmMoveUI(m){
  const pos = currentPosition();
  const san = pos.san(m);
  showModal({
    title:'Confirm move',
    bodyHtml:`<p class="t-body">Play <strong class="t-mono">${san}</strong>?</p>`,
    actions:[
      {label:'Cancel', kind:'ghost', onClick:(close)=>{ pendingConfirm=null; close(); }},
      {label:'Play move', kind:'primary', onClick:(close)=>{ close(); commitMove(m); }},
    ]
  });
}

function flashInvalid(sq){
  const el = squareEl(sq);
  if (!el) return;
  el.animate([{boxShadow:'inset 0 0 0 3px var(--danger)'},{boxShadow:'inset 0 0 0 0px transparent'}],
    {duration:320, easing:'ease-out'});
}

function commitMove(m, opts={}){
  const pos = state.mode==='editor' ? state.editorBoard : state.game.pos;
  const game = state.game;
  const fromSq = m.from, toSq = m.to;
  const isCapture = !!m.captured;
  const wasCheckBefore = false;

  animateMove(fromSq, toSq, isCapture, ()=>{});

  const rec = game.move(m);
  if (!rec){ toast('That move could not be played.', 'err'); return; }

  state.lastMove = { from:m.from, to:m.to, capture:!!m.captured || m.flags==='e' };
  state.viewPly = game.history.length;
  state.moveTimestamps.push(Date.now());

  if (m.flags==='k' || m.flags==='q') Audio1.play('castle');
  else if (m.promotion) Audio1.play('promote');
  else if (isCapture) Audio1.play('capture');
  else Audio1.play('move');

  const nowCheck = game.pos.inCheck();
  if (nowCheck && !game.result) setTimeout(()=>Audio1.play('check'), 90);
  if (nowCheck){ boardWrapEl.classList.remove('shake'); void boardWrapEl.offsetWidth; boardWrapEl.classList.add('shake'); }

  detectOpening();
  applyClockIncrement(rec);
  renderAll();
  saveCurrentGame();

  announce(`${rec.san}${nowCheck? ', check':''}`);

  if (game.result){
    if (state.mode === 'puzzle') handlePuzzleUserMove(m);
    handleGameEnd(game.result);
    return;
  }

  startClockFor(game.turn());

  if (state.mode === 'puzzle'){ handlePuzzleUserMove(m); return; }

  if (state.mode === 'ai' && game.turn() === state.aiSide && !game.result){
    scheduleAIMove();
  }
}

function openPromotionPicker(from, to, color, cb){
  const isWhite = color === WHITE;
  const items = ['q','r','b','n'];
  const modal = showModal({
    title:'Promote pawn',
    narrow:true,
    bodyHtml:`<div class="promo-grid" id="promo-grid"></div>`,
    dismissible:false,
    actions:[]
  });
  const grid = modal.querySelector('#promo-grid');
  for (const pr of items){
    const btn = document.createElement('button');
    btn.className='promo-btn';
    const letter = isWhite? pr.toUpperCase(): pr;
    btn.innerHTML = pieceSvg(letter, state.settings.pieceSet) + `<span>${({q:'Queen',r:'Rook',b:'Bishop',n:'Knight'})[pr]}</span>`;
    btn.addEventListener('click', ()=>{ closeModal(); cb(pr); });
    grid.appendChild(btn);
  }
}

let dragState = null;
function initBoardInteraction(){
  boardWrapEl.addEventListener('pointerdown', (e)=>{
    if (e.button != null && e.button !== 0) return;
    const sq = squareFromEvent(e);
    if (sq==null) return;

    if (state.mode==='editor'){
      const pcEl = e.target.closest('.pc');
      if (pcEl){ startEditorDrag(e, pcEl); }
      else { handleEditorClick(e); }
      return;
    }
    if (!humanTurnAllowed()){
      if (state.mode==='analysis' || isReviewingHistory()) toast('Jump to the latest move to continue playing.', 'warn', 2000);
      return;
    }
    const pos = currentPosition();
    const piece = pos.board[sq];
    const rect = boardWrapEl.getBoundingClientRect();
    const pcEl = piecesEl.querySelector(`.pc[data-sq="${sq}"]`);

    if (piece && colorOf(piece) === pos.turn){

      dragState = { sq, el:pcEl, rect, moved:false, mode:'own' };
      if (pcEl){ pcEl.setPointerCapture && pcEl.setPointerCapture(e.pointerId); pcEl.classList.add('dragging'); }
      trySelect(sq);
    } else if (state.selected >= 0){

      dragState = { sq, el:null, rect, moved:false, mode:'target', from:state.selected };
    } else {
      dragState = null;
    }
  });

  boardWrapEl.addEventListener('pointermove', (e)=>{
    if (!dragState || dragState.mode!=='own' || !dragState.el) return;
    dragState.moved = true;
    const rect = dragState.rect;
    const x = clamp(e.clientX-rect.left, 0, rect.width);
    const y = clamp(e.clientY-rect.top, 0, rect.height);
    const el = dragState.el;
    el.style.transitionDuration='0ms';
    el.style.width = (rect.width/8)+'px';
    el.style.height = (rect.height/8)+'px';
    el.style.position='absolute';
    el.style.left='0'; el.style.top='0';
    el.style.transform = `translate(${x-rect.width/16}px, ${y-rect.height/16}px)`;
    const col = clamp(Math.floor(x/rect.width*8),0,7), row = clamp(Math.floor(y/rect.height*8),0,7);
    const sq = xyToSq(col,row);
    if (state.legalTargets.some(m=>m.to===sq)){
      dropRingEl.classList.add('on');
      dropRingEl.style.left=(col*12.5)+'%'; dropRingEl.style.top=(row*12.5)+'%';
    } else dropRingEl.classList.remove('on');
  });

  function endPointer(e){
    if (!dragState) return;
    const ds = dragState; dragState = null;
    dropRingEl.classList.remove('on');

    if (ds.mode==='own'){
      if (ds.el){ ds.el.classList.remove('dragging'); ds.el.style.width=''; ds.el.style.height=''; ds.el.style.position=''; }
      if (!ds.moved){

        if (ds.el) positionPieceEl(ds.el, ds.sq);
        return;
      }
      const rect = ds.rect;
      const x = clamp((e.clientX!=null?e.clientX:e.changedTouches?.[0]?.clientX)-rect.left, 0, rect.width-1);
      const y = clamp((e.clientY!=null?e.clientY:e.changedTouches?.[0]?.clientY)-rect.top, 0, rect.height-1);
      const col = clamp(Math.floor(x/rect.width*8),0,7), row=clamp(Math.floor(y/rect.height*8),0,7);
      const targetSq = xyToSq(col,row);
      if (ds.el) positionPieceEl(ds.el, ds.sq);
      if (targetSq === ds.sq) return;
      attemptMove(ds.sq, targetSq);
    } else if (ds.mode==='target'){

      attemptMove(ds.from, ds.sq);
    }
  }
  boardWrapEl.addEventListener('pointerup', endPointer);
  boardWrapEl.addEventListener('pointercancel', ()=>{ dragState=null; dropRingEl.classList.remove('on'); });

  boardEl.addEventListener('keydown', (e)=>{
    if (!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(e.key)) return;
    e.preventDefault();
    if (!boardEl._focusSq) boardEl._focusSq = 0;
    let {col,row} = sqToXY(boardEl._focusSq);
    if (e.key==='ArrowUp') row=clamp(row-1,0,7);
    if (e.key==='ArrowDown') row=clamp(row+1,0,7);
    if (e.key==='ArrowLeft') col=clamp(col-1,0,7);
    if (e.key==='ArrowRight') col=clamp(col+1,0,7);
    boardEl._focusSq = xyToSq(col,row);
    if (e.key==='Enter' || e.key===' '){ if(humanTurnAllowed()) trySelect(boardEl._focusSq); }
  });
}
function squareFromEvent(e){
  const rect = boardWrapEl.getBoundingClientRect();
  const cx = e.clientX!=null ? e.clientX : e.changedTouches?.[0]?.clientX;
  const cy = e.clientY!=null ? e.clientY : e.changedTouches?.[0]?.clientY;
  const x = cx-rect.left, y=cy-rect.top;
  if (x<0||y<0||x>rect.width||y>rect.height) return null;
  const col = clamp(Math.floor(x/rect.width*8),0,7), row = clamp(Math.floor(y/rect.height*8),0,7);
  return xyToSq(col,row);
}

let clockTimer = null;
function initClock(baseSec, incSec){
  if (baseSec<=0){ state.clock=null; renderClocks(); return; }
  state.clock = {
    base: baseSec, inc: incSec,
    wMs: baseSec*1000, bMs: baseSec*1000,
    active: null, lastTick: null, flagged:null,
  };
  renderClocks();
}
function startClockFor(side){
  if (!state.clock) return;
  state.clock.active = side;
  state.clock.lastTick = performance.now();
  if (!clockTimer) clockTimer = setInterval(tickClock, 100);
}
function pauseClock(){ if(state.clock) state.clock.active=null; }
function tickClock(){
  const c = state.clock;
  if (!c || !c.active || state.result) return;
  const now = performance.now();
  const dt = now - c.lastTick;
  c.lastTick = now;
  const key = c.active==='w' ? 'wMs':'bMs';
  c[key] = Math.max(0, c[key]-dt);
  if (c[key] === 0 && !c.flagged){
    const flaggedSide = c.active;
    c.flagged = flaggedSide;
    pauseClock();
    handleTimeout(flaggedSide);
  }
  renderClocks();
}
function applyClockIncrement(rec){
  const c = state.clock;
  if (!c) return;

  const moverColor = rec.move.piece === rec.move.piece.toUpperCase() ? 'w':'b';
  if (c.inc>0){
    const key = moverColor==='w'?'wMs':'bMs';
    c[key] += c.inc*1000;
  }
}
function renderClocks(){
  const c = state.clock;
  const topWrap = document.getElementById('clocks-top');
  const botWrap = document.getElementById('clocks-bottom');
  topWrap.innerHTML=''; botWrap.innerHTML='';
  if (!c){ return; }
  const flipped = orientationFlipped();
  const topSide = flipped ? 'w' : 'b';
  const botSide = flipped ? 'b' : 'w';
  topWrap.appendChild(clockCard(topSide));
  botWrap.appendChild(clockCard(botSide));
}
function clockCard(side){
  const c = state.clock;
  const ms = side==='w'? c.wMs : c.bMs;
  const name = state.players[side] || (side==='w'?'White':'Black');
  const div = document.createElement('div');
  const low = ms <= 20000 && ms>0;
  div.className = 'clock' + (c.active===side?' active':'') + (low?' low':'') + (c.flagged?' flag':'');
  const pct = clamp(ms/(c.base*1000)*100,0,100);
  div.innerHTML = `
    <div class="clock-side">
      <span class="side-dot ${side}"></span>
      <div class="flex-1">
        <div class="clock-name">${escapeHtml(name)}</div>
        <div class="clock-meta">${side==='w'?'White':'Black'}${c.inc?` · +${c.inc}s`:''}</div>
      </div>
    </div>
    <div class="clock-time t-num">${fmtClock(ms)}</div>
    <div class="clock-bar" style="width:${pct}%"></div>`;
  if (low && c.active===side && ms>0 && !div._warned){ }
  return div;
}
function handleTimeout(side){
  if (!state.game || state.result) return;
  const winner = other(side);
  const material = state.game.pos.materialCount();
  const insufficientForWinner = (()=>{

    const p = state.game.pos;
    return p.insufficientMaterial();
  })();
  const result = insufficientForWinner
    ? { type:'draw', winner:null, reason:'Timeout vs insufficient material' }
    : { type:'timeout', winner, reason:`Time out — ${side==='w'?'White':'Black'} ran out of time` };
  state.game.result = result;
  Audio1.play('end');
  handleGameEnd(result);
}

const AI_TIME_MS = {
  beginner: 260, easy: 420, intermediate: 750, advanced: 1300, expert: 2200
};
function scheduleAIMove(){
  if (!state.game || state.result) return;
  state.aiThinking = true;
  renderEngineStatus();
  const pos = state.game.pos.clone();
  const level = state.aiLevel;
  const delay = AI_TIME_MS[level] || 700;
  const t0 = performance.now();
  setTimeout(()=>{

    let result;
    try { result = searchRoot(pos, level, Math.random, Math.max(80, delay*0.9)); }
    catch(e){  result=null; }
    const elapsed = performance.now()-t0;
    const minShow = Math.min(delay, 1800);
    const wait = Math.max(0, minShow-elapsed);
    setTimeout(()=>{
      state.aiThinking = false;
      if (!result || !result.move || state.result || !state.game){ renderEngineStatus(); return; }
      renderEngineStatus(result);
      commitMove(result.move);
    }, wait);
  }, 30);
}
function renderEngineStatus(lastResult){
  const el = document.getElementById('engine-status');
  if (!el) return;
  if (state.mode !== 'ai'){ el.innerHTML=''; return; }
  if (state.aiThinking){
    el.innerHTML = `<div class="thinking"><span>Engine thinking</span><span class="think-dots"><i></i><i></i><i></i></span></div>
      <div class="think-bar"><i></i></div>`;
    return;
  }
  if (lastResult && lastResult.move){
    const scoreTxt = fmtEval(lastResult.score);
    el.innerHTML = `<div class="t-micro">Engine played <strong class="t-mono">${state.lastAiSan||''}</strong> · eval ${scoreTxt} · depth ${lastResult.depth||'—'}</div>`;
    return;
  }
  el.innerHTML = '';
}

function detectOpening(){
  if (!state.game) return;
  const sans = state.game.history.slice(0,10).map(h=>h.san.replace(/[+#]/g,''));
  const name = matchOpening(sans);
  state.openingName = name;
  const badge = document.getElementById('opening-badge');
  if (name){ badge.hidden=false; badge.textContent = name; } else { badge.hidden=true; }
}

function newGame(opts={}){
  const mode = opts.mode || state.mode;
  state.mode = mode;
  state.game = new Game(opts.fen || START_FEN);
  state.viewPly = 0;
  state.selected=-1; state.legalTargets=[]; state.lastMove=null; state.result=null;
  if (mode!=='puzzle'){ state.currentPuzzle=null; state.puzzleSolveState=null; }
  const hintSlot = document.getElementById('hint-slot');
  if (hintSlot) hintSlot.innerHTML='';
  state.reviewMode=false; state.openingName=null; state.moveTimestamps=[];
  state.gameStartTs = Date.now();
  state.lastAiSan='';
  document.getElementById('mate-glow').classList.remove('on');

  if (mode==='ai'){
    state.aiLevel = document.getElementById('sel-difficulty').value;
    const pref = opts.side || document.querySelector('.seg-btn[data-side][aria-pressed="true"]')?.dataset.side || 'w';
    const humanSide = pref==='r' ? (Math.random()<0.5?'w':'b') : pref;
    state.aiSide = humanSide==='w' ? 'b':'w';
    state.players = { w: humanSide==='w'?'You':'Engine', b: humanSide==='b'?'You':'Engine' };
    state.settings.orientation = humanSide==='b' ? 'black':'white';
  } else if (mode==='local'){
    state.players = { w:'White', b:'Black' };
  } else if (mode==='puzzle'){

  }

  const tc = opts.timeControl;
  if (tc && tc.base>0) initClock(tc.base, tc.inc); else { state.clock=null; }

  renderAll();
  Audio1.play('start');
  if (mode==='ai' && state.game.turn()===state.aiSide) scheduleAIMove();
  if (state.clock) startClockFor(state.game.turn());
  saveCurrentGame();
  announce('New game started.');
}

function handleGameEnd(result){
  pauseClock();
  Audio1.play('end');
  const glow = document.getElementById('mate-glow');
  if (result.type==='checkmate'){ glow.classList.remove('on'); void glow.offsetWidth; glow.classList.add('on'); }
  recordGameStats(result);
  saveCurrentGame();
  setTimeout(()=>showResultModal(result), result.type==='checkmate'?550:150);
}

function resignGame(){
  if (!state.game || state.game.result) return;
  const resigner = state.game.turn();
  const winner = other(resigner);
  const result = { type:'resignation', winner, reason:`${resigner==='w'?'White':'Black'} resigned` };
  state.game.result = result;
  handleGameEnd(result);
}
function claimDraw(){
  if (!state.game || state.game.result) return;
  if (state.game.isThreefold() || state.game.pos.halfmove>=100){
    const reason = state.game.isThreefold() ? 'Threefold repetition (claimed)' : 'Fifty-move rule (claimed)';
    const result = { type:'draw', winner:null, reason };
    state.game.result = result;
    handleGameEnd(result);
  } else {
    toast('No draw is currently claimable.', 'warn');
  }
}

function renderAll(){
  fullBoardRender(false);
  renderClocks();
  renderMoveList();
  renderCaptured();
  renderGameInfo();
  renderTurnBadge();
  renderNavButtons();
  syncMobilePanels();
}

function renderTurnBadge(){
  const badge = document.getElementById('turn-badge');
  const stateBadge = document.getElementById('state-badge');
  if (!state.game){ badge.textContent='—'; stateBadge.hidden=true; return; }
  if (state.game.result){
    const r = state.game.result;
    badge.textContent = r.reason;
    stateBadge.hidden = true;
  } else {
    const pos = currentPosition();
    const turnName = pos.turn==='w' ? (state.players.w||'White') : (state.players.b||'Black');
    badge.textContent = `${turnName} to move`;
    if (pos.inCheck()){ stateBadge.hidden=false; stateBadge.textContent='Check'; stateBadge.className='badge badge-danger'; }
    else stateBadge.hidden=true;
    if (isReviewingHistory()){ stateBadge.hidden=false; stateBadge.textContent='Viewing history'; stateBadge.className='badge badge-warn'; }
  }
}

function renderMoveList(){
  const wrap = document.getElementById('movelist');
  const empty = document.getElementById('movelist-empty');
  const countBadge = document.getElementById('movecount-badge');
  if (!state.game || !state.game.history.length){
    wrap.innerHTML=''; empty.hidden=false; countBadge.textContent='0';
    syncMobileMoveList();
    return;
  }
  empty.hidden=true;
  const hist = state.game.history;
  countBadge.textContent = hist.length;
  let html = '';
  for (let i=0;i<hist.length;i+=2){
    const num = i/2+1;
    const wMove = hist[i], bMove = hist[i+1];
    const wActive = state.viewPly === i+1;
    const bActive = bMove && state.viewPly === i+2;
    html += `<div class="ml-num">${num}.</div>`;
    html += `<button class="ml-mv${wActive?' current':''}" data-ply="${i+1}">${escapeHtml(wMove.san)}</button>`;
    html += bMove ? `<button class="ml-mv${bActive?' current':''}" data-ply="${i+2}">${escapeHtml(bMove.san)}</button>`
                  : `<div class="ml-mv empty"></div>`;
  }
  wrap.innerHTML = html;
  wrap.querySelectorAll('.ml-mv:not(.empty)').forEach(btn=>{
    btn.addEventListener('click', ()=>jumpToPly(parseInt(btn.dataset.ply,10)));
  });
  const cur = wrap.querySelector('.current');
  if (cur) cur.scrollIntoView({ block:'nearest' });
  syncMobileMoveList();
}
function stripIds(root){
  root.removeAttribute && root.removeAttribute('id');
  root.querySelectorAll && root.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
  return root;
}
function syncMobileMoveList(){
  const mp = document.getElementById('mpanel-moves');
  if (!mp) return;
  const src = document.getElementById('card-moves');
  if (src && state.mode !== 'editor'){
    const clone = src.cloneNode(true);
    stripIds(clone);
    mp.innerHTML=''; mp.appendChild(clone);
  }
  mp.querySelectorAll('.ml-mv:not(.empty)').forEach(btn=>{
    btn.addEventListener('click', ()=>jumpToPly(parseInt(btn.dataset.ply,10)));
  });
  const navGroup = mp.querySelector('.navbtns');
  if (navGroup) wireNavButtons(navGroup);
  const copyBtn = mp.querySelector('[data-role="copy-pgn"]');
  if (copyBtn) copyBtn.addEventListener('click', copyPgnToClipboard);
}
function syncMobilePanels(){
  syncMobileMoveList();
  syncMobileAnalysis();
  syncMobileControls();
}

function jumpToPly(ply){
  state.viewPly = clamp(ply, 0, state.game.history.length);
  state.selected=-1; state.legalTargets=[];
  if (state.viewPly === state.game.history.length){
    const last = state.game.history[state.viewPly-1];
    state.lastMove = last ? { from:last.move.from, to:last.move.to, capture:!!last.move.captured || last.move.flags==='e' } : null;
  } else if (state.viewPly>0){
    const rec = state.game.history[state.viewPly-1];
    state.lastMove = { from:rec.move.from, to:rec.move.to, capture:!!rec.move.captured || rec.move.flags==='e' };
  } else state.lastMove = null;
  renderAll();
}
function navFirst(){ if(state.game) jumpToPly(0); }
function navPrev(){ if(state.game) jumpToPly(state.viewPly-1); }
function navNext(){ if(state.game) jumpToPly(state.viewPly+1); }
function navLast(){ if(state.game) jumpToPly(state.game.history.length); }
function renderNavButtons(){
  const has = !!state.game && state.game.history.length>0;
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    const kind = btn.dataset.nav;
    if (kind==='first'||kind==='prev') btn.disabled = !has || state.viewPly<=0;
    else btn.disabled = !has || state.viewPly>=state.game.history.length;
  });
  document.getElementById('badge-undo').textContent = state.game? state.game.history.length : 0;
  document.getElementById('badge-redo').textContent = state.game? state.game.future.length : 0;
}
function wireNavButtons(scope){
  scope.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const k = btn.dataset.nav;
      if (k==='first') navFirst(); else if(k==='prev') navPrev();
      else if(k==='next') navNext(); else navLast();
    });
  });
}

function renderCaptured(){
  const wrap = document.getElementById('captured');
  if (!state.game || !state.settings.showCaptured){ wrap.innerHTML=''; return; }
  const pos = currentPosition();
  const full = { P:8,N:2,B:2,R:2,Q:1 };
  const mat = pos.materialCount();
  const capturedOf = (side)=>{
    const out=[];
    for (const t of ['Q','R','B','N','P']){
      const have = mat[side][t]||0;
      const missing = (full[t]||0) - have;
      for (let i=0;i<missing;i++) out.push(t);
    }
    return out;
  };
  const capW = capturedOf('b');
  const capB = capturedOf('w');
  const val = {P:1,N:3,B:3,R:5,Q:9};
  const sum = arr => arr.reduce((a,t)=>a+(val[t]||0),0);
  const advW = sum(capW) - sum(capB);
  wrap.innerHTML = `
    <div class="cap-row"><span class="cap-label">White</span><div class="cap-pcs" id="cap-w"></div>${advW>0?`<span class="cap-adv">+${advW}</span>`:''}</div>
    <div class="cap-row"><span class="cap-label">Black</span><div class="cap-pcs" id="cap-b"></div>${advW<0?`<span class="cap-adv">+${-advW}</span>`:''}</div>`;
  const capWEl = wrap.querySelector('#cap-w'), capBEl = wrap.querySelector('#cap-b');
  if (!capW.length && !capB.length){ wrap.innerHTML += `<div class="cap-none">No captures yet</div>`; }
  capW.forEach(t=>{ const d=document.createElement('div'); d.className='cap-pc'; d.innerHTML=pieceSvg(t.toLowerCase(), state.settings.pieceSet); capWEl.appendChild(d); });
  capB.forEach(t=>{ const d=document.createElement('div'); d.className='cap-pc'; d.innerHTML=pieceSvg(t, state.settings.pieceSet); capBEl.appendChild(d); });
}

function matchOpening(sanList){
  let best=null;
  for (const o of OPENING_BOOK){
    if (o.moves.length>sanList.length) continue;
    let ok=true;
    for (let i=0;i<o.moves.length;i++) if (o.moves[i]!==sanList[i]){ ok=false; break; }
    if (ok && (!best || o.moves.length>best.moves.length)) best=o;
  }
  return best? best.name : null;
}

function recordGameStats(result){
  if (state.mode==='puzzle' || state.mode==='analysis' || state.mode==='editor') return;
  const s = state.stats;
  s.played++;
  const moves = state.game.history.length;
  s.totalMoves += moves;
  const durationSec = state.gameStartTs ? Math.round((Date.now()-state.gameStartTs)/1000) : 0;
  s.totalGameSeconds += durationSec;

  let outcome = 'draw';
  if (result.type!=='draw'){
    const humanIsWinner = state.mode==='ai' ? (result.winner === other(state.aiSide)) : null;
    if (state.mode==='ai'){ outcome = humanIsWinner ? 'win':'loss'; }
    else outcome = 'decisive';
  }
  if (outcome==='win'){ s.wins++; s.streak = Math.max(0,s.streak)+1; s.bestStreak=Math.max(s.bestStreak,s.streak);
    if (s.fastestWinMoves==null || moves<s.fastestWinMoves) s.fastestWinMoves=moves; }
  else if (outcome==='loss'){ s.losses++; s.streak = Math.min(0,s.streak)-1; }
  else if (outcome==='draw'){ s.draws++; s.streak=0; }
  else { s.draws += 0; }

  s.longestGameMoves = Math.max(s.longestGameMoves, moves);
  if (state.openingName) s.openings[state.openingName] = (s.openings[state.openingName]||0)+1;
  s.history.unshift({ result: result.reason, outcome, moves, date: Date.now(),
    opening: state.openingName, mode: state.mode, level: state.mode==='ai'?state.aiLevel:null });
  s.history = s.history.slice(0,60);
  persistStats();
}

function toPGN(){
  const g = state.game;
  if (!g) return '';
  const tags = [];
  const now = new Date();
  tags.push(`[Event "Meridian Casual Game"]`);
  tags.push(`[Site "Meridian Chess"]`);
  tags.push(`[Date "${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}"]`);
  tags.push(`[Round "1"]`);
  tags.push(`[White "${state.players.w||'White'}"]`);
  tags.push(`[Black "${state.players.b||'Black'}"]`);
  let resultTag='*';
  if (g.result){
    if (g.result.type==='draw') resultTag='1/2-1/2';
    else if (g.result.winner==='w') resultTag='1-0';
    else if (g.result.winner==='b') resultTag='0-1';
  }
  tags.push(`[Result "${resultTag}"]`);
  if (g.startFen !== START_FEN) tags.push(`[SetUp "1"]`), tags.push(`[FEN "${g.startFen}"]`);
  if (state.openingName) tags.push(`[Opening "${state.openingName}"]`);
  let body='';
  for (let i=0;i<g.history.length;i+=2){
    body += `${i/2+1}. ${g.history[i].san} `;
    if (g.history[i+1]) body += `${g.history[i+1].san} `;
  }
  body += resultTag;
  return tags.join('\n') + '\n\n' + wrapText(body, 78);
}
function wrapText(s, width){
  const words = s.split(' ');
  let lines=[], cur='';
  for (const w of words){
    if ((cur+' '+w).trim().length>width){ lines.push(cur.trim()); cur=w; }
    else cur = (cur+' '+w).trim();
  }
  if (cur) lines.push(cur);
  return lines.join('\n');
}
function parsePGN(text){

  const tagRe = /\[(\w+)\s+"([^"]*)"\]/g;
  const tags = {};
  let m; while((m=tagRe.exec(text))) tags[m[1]]=m[2];
  let body = text.replace(/\[[^\]]*\]/g,'').trim();
  body = body.replace(/\{[^}]*\}/g,'');
  body = body.replace(/\([^)]*\)/g,'');
  body = body.replace(/\$\d+/g,'');
  body = body.replace(/(1-0|0-1|1\/2-1\/2|\*)\s*$/,'').trim();
  const tokens = body.split(/\s+/).filter(t=>t && !/^\d+\.(\.\.)?$/.test(t));
  const fen = tags.FEN || START_FEN;
  const v = Position.validateFen(fen);
  if (!v.ok) throw new Error('Invalid starting FEN in PGN: '+v.error);
  const game = new Game(fen);
  for (const tok of tokens){
    const clean = tok.replace(/^\d+\.(\.\.)?/,'');
    if (!clean) continue;
    const mv = game.pos.moveFromSan(clean);
    if (!mv) throw new Error(`Could not parse move "${clean}" — the game may use unsupported notation.`);
    game.move(mv);
  }
  return { game, tags };
}

function analyzeCurrentPosition(showUI=true){
  const pos = currentPosition();
  if (!pos) return null;
  const fen = pos.fen();
  if (state.analysisCache.has(fen)) return state.analysisCache.get(fen);
  const r = searchRoot(pos, 'expert', Math.random, 900);
  const perspective = pos.turn==='w' ? 1 : -1;
  const whiteScore = r.score * perspective;
  const mateIn = Math.abs(r.score) > 90000 ? Math.ceil((100000-Math.abs(r.score))/1) : null;
  const info = {
    fen, score: whiteScore,
    mate: mateIn ? (whiteScore>0? mateIn: -mateIn) : null,
    best: r.best ? pos.san(r.best.move) : null,
    bestMove: r.best ? r.best.move : null,
    candidates: (r.candidates||[]).map(c=>({ san: pos.san(c.move), score: c.score*perspective, move:c.move })),
    depth: r.depth,
  };
  state.analysisCache.set(fen, info);
  if (showUI) renderAnalysisPanel(info);
  return info;
}

}

function classifyMoveQuality(prevScoreWhitePersp, newScoreWhitePersp, sideJustMoved){

  const sideMul = sideJustMoved==='w'?1:-1;
  const before = prevScoreWhitePersp*sideMul;
  const after = newScoreWhitePersp*sideMul;
  const delta = after - before;
  if (delta >= -5) return 'best';
  if (delta >= -25) return 'excellent';
  if (delta >= -60) return 'good';
  if (delta >= -120) return 'inaccuracy';
  if (delta >= -280) return 'mistake';
  return 'blunder';
}
function computeGameReview(){
  if (!state.game || state.game.history.length===0) return null;
  const g = state.game;
  const p = new Position(g.startFen);
  let prevWhiteScore = 0;
  const rows = [];
  const tally = { best:0, excellent:0, good:0, inaccuracy:0, mistake:0, blunder:0, book:0 };
  for (let i=0;i<g.history.length;i++){
    const mover = colorOf(g.history[i].move.piece);
    const isBook = i<8 && OPENING_BOOK.some(o=>o.moves.slice(0,i+1).join(',')===g.history.slice(0,i+1).map(h=>h.san.replace(/[+#]/g,'')).join(','));
    const r = searchRoot(p, 'advanced', Math.random, 220);
    const perspective = p.turn==='w'?1:-1;
    const evalBefore = r.score*perspective;
    p.makeMove(g.history[i].move);
    const r2 = searchRoot(p, 'advanced', Math.random, 220);
    const evalAfter = r2.score * (p.turn==='w'?1:-1);
    let quality = isBook ? 'book' : classifyMoveQuality(evalBefore, evalAfter, mover);
    tally[quality] = (tally[quality]||0)+1;
    rows.push({ ply:i+1, san:g.history[i].san, quality, mover });
  }
  const scored = rows.filter(r=>r.quality!=='book');
  const weight = { best:100, excellent:92, good:78, inaccuracy:55, mistake:30, blunder:5 };
  const accByColor = (color)=>{
    const mv = scored.filter(r=>r.mover===color);
    if (!mv.length) return 100;
    return Math.round(mv.reduce((a,r)=>a+weight[r.quality],0)/mv.length);
  };
  return { rows, tally, accuracy: { w: accByColor('w'), b: accByColor('b') } };
}

const HINT_REASONS = {
  develop: 'Develop a piece toward the center before committing further.',
  castle: 'Get your king to safety — castling is available and useful here.',
  capture: 'This wins material — take the free piece.',
  check: 'This move gives check and forces a response.',
  center: 'Contest the center to open lines for your other pieces.',
  defend: 'This move addresses your opponent\u2019s biggest threat.',
  improve: 'This improves your worst-placed piece.',
  tactic: 'There is a tactical shot available in this position.',
};
function reasonForMove(pos, move){
  if (move.captured) return HINT_REASONS.capture;
  const u = pos.makeMove(move);
  const gives = pos.inCheck();
  pos.unmakeMove(u);
  if (gives) return HINT_REASONS.check;
  if (move.flags==='k'||move.flags==='q') return HINT_REASONS.castle;
  const t = move.piece.toUpperCase();
  if ((t==='N'||t==='B') && pos.fullmove<=10) return HINT_REASONS.develop;
  if (t==='P' && [3,4].includes(move.to>>3)===false && [3,4].includes(move.from>>3)) return HINT_REASONS.center;
  return HINT_REASONS.improve;
}
function showHint(){
  const pos = currentPosition();
  if (!pos || !humanTurnAllowed()){ toast('Hints are available on your turn.', 'warn'); return; }
  const info = analyzeCurrentPosition(false);
  if (!info || !info.bestMove){ toast('No hint available for this position.', 'warn'); return; }
  const move = info.bestMove;
  state.selected=-1; state.legalTargets=[];

  [fe,te].forEach(e=>e && e.animate([{boxShadow:'inset 0 0 0 4px var(--gold)'},{boxShadow:'inset 0 0 0 0 transparent'}],
    { duration:1600, iterations:2, easing:'ease-in-out' }));

    ${stateTxt}

function handlePuzzleUserMove(move){
  const p = state.currentPuzzle;
  const pos = state.game.pos;
  const played = state.game.history[state.game.history.length-1].san.replace(/[+#]/g,'');
  const expected = String(p.solution[state.puzzleMoveIdx]||'').replace(/[+#]/g,'');
  if (played !== expected){
    state.puzzleSolveState = 'failed';
    renderPuzzleUI();
    Audio1.play('illegal');
    toast('That is not the winning move here. Try again.', 'warn');
    setTimeout(()=>{ state.game.undo(); state.viewPly=state.game.history.length;
      const last=state.game.history[state.game.history.length-1];
      state.lastMove = last?{from:last.move.from,to:last.move.to,capture:!!last.move.captured || last.move.flags==='e'}:null;
      state.puzzleSolveState='solving'; renderAll(); renderPuzzleUI(); }, 1100);
    return;
  }
  state.puzzleMoveIdx++;
  if (state.puzzleMoveIdx >= p.solution.length){
    state.puzzleSolveState = 'solved';
    markPuzzleSolved(p.id);
    renderPuzzleUI();
    Audio1.play('promote');
    toast('Puzzle solved!');
    return;
  }
  const followSan = p.follow[state.puzzleMoveIdx-1];
  setTimeout(()=>{
    if (followSan){
      const mv = state.game.pos.moveFromSan(followSan);
      if (mv){
        animateMove(mv.from, mv.to, !!mv.captured, ()=>{});
        state.game.move(mv);
        state.viewPly = state.game.history.length;
        state.lastMove = { from:mv.from, to:mv.to, capture:!!mv.captured || mv.flags==='e' };
        Audio1.play(mv.captured?'capture':'move');
        renderAll();
      }
    }
    if (state.puzzleMoveIdx >= p.solution.length){
      state.puzzleSolveState='solved'; markPuzzleSolved(p.id); renderPuzzleUI(); Audio1.play('promote'); toast('Puzzle solved!');
    } else renderPuzzleUI();
  }, 450);
}
function resetPuzzle(){ if (state.currentPuzzle) loadPuzzle(state.currentPuzzle); }
function puzzleHint(){
  const p = state.currentPuzzle;
  if (!p || state.puzzleSolveState!=='solving') return;
  const expected = p.solution[state.puzzleMoveIdx];
  const mv = state.game.pos.moveFromSan(expected) || state.game.pos.moveFromSan(String(expected||'').replace(/[+#]/g,''));
  if (!mv) return;
  const fe=squareEl(mv.from), te=squareEl(mv.to);
  [fe,te].forEach(e=>e && e.animate([{boxShadow:'inset 0 0 0 4px var(--gold)'},{boxShadow:'inset 0 0 0 0 transparent'}],
    { duration:1500, iterations:2 }));
  toast('Highlighted the source and destination squares.', 'ok', 2000);
}

let activeModal = null;
function showModal({ title, bodyHtml, actions=[], wide=false, narrow=false, dismissible=true, onClose=null }){
  closeModal(true);
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.setAttribute('role','presentation');
  const modal = document.createElement('div');
  modal.className = 'modal' + (wide?' modal-wide':'') + (narrow?' modal-narrow':'');
  modal.setAttribute('role','dialog'); modal.setAttribute('aria-modal','true');
  const titleId = 'modal-title-'+uid();
  modal.setAttribute('aria-labelledby', titleId);
  modal.innerHTML = `
    <div class="modal-hd">
      <div class="modal-hd-txt"><h2 class="t-h2" id="${titleId}">${title}</h2></div>
      ${dismissible? `<button class="icon-btn" data-close aria-label="Close dialog"><span class="ico" data-ico="close"></span></button>`:''}
    </div>
    <div class="modal-bd">${bodyHtml}</div>
    ${actions.length? `<div class="modal-ft">${actions.map((a,i)=>`<button class="btn ${a.kind==='primary'?'btn-primary':a.kind==='danger'?'btn-danger':a.kind==='ghost'?'btn-ghost':''}" data-act="${i}">${escapeHtml(a.label)}</button>`).join('')}</div>`:''}
  `;
  scrim.appendChild(modal);
  document.getElementById('modal-root').appendChild(scrim);
  scrim.querySelectorAll('[data-ico]').forEach(hydrateIcon);
  const close = ()=>closeModal();
  if (dismissible){
    modal.querySelector('[data-close]')?.addEventListener('click', close);
    scrim.addEventListener('mousedown', (e)=>{ if(e.target===scrim) close(); });
  }
  actions.forEach((a,i)=>{
    modal.querySelector(`[data-act="${i}"]`).addEventListener('click', ()=>a.onClick? a.onClick(close): close());
  });
  activeModal = { scrim, dismissible, onClose };
  document.addEventListener('keydown', escCloseHandler);
  const focusable = modal.querySelector('button, input, select, textarea, [tabindex]');
  setTimeout(()=>focusable && focusable.focus(), 30);
  trapFocus(modal);
  return modal;
}
function escCloseHandler(e){
  if (e.key==='Escape' && activeModal && activeModal.dismissible) closeModal();
}
function closeModal(skipAnim){
  if (!activeModal) return;
  const { scrim, onClose } = activeModal;
  document.removeEventListener('keydown', escCloseHandler);
  if (skipAnim){ scrim.remove(); activeModal=null; onClose && onClose(); return; }
  scrim.classList.add('closing');
  setTimeout(()=>{ scrim.remove(); }, 190);
  activeModal = null;
  onClose && onClose();
}
function trapFocus(modal){
  modal.addEventListener('keydown', (e)=>{
    if (e.key!=='Tab') return;
    const f = Array.from(modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
      .filter(el=>!el.disabled && el.offsetParent!==null);
    if (!f.length) return;
    const first=f[0], last=f[f.length-1];
    if (e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  });
}

function animateCount(el){
  const target = parseFloat(el.dataset.count)||0;
  const suffix = el.dataset.suffix||'';
  if (state.settings.reducedMotion){ el.textContent = target+suffix; return; }
  const dur = 700; const t0 = performance.now();
  function step(t){
    const p = clamp((t-t0)/dur, 0, 1);
    const eased = 1-Math.pow(1-p,3);
    el.textContent = Math.round(target*eased)+suffix;
    if (p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function runCmd(cmd){
  switch(cmd){
    case 'new-game': openNewGameModal(); break;
    case 'restart': if(state.game) newGame({mode:state.mode, fen: state.game.startFen}); break;
    case 'undo': doUndo(); break;
    case 'redo': doRedo(); break;
    case 'resign': confirmResign(); break;
    case 'offer-draw': claimDraw(); break;
    case 'analyze': analyzeCurrentPosition(true); break;
    case 'hint': showHint(); break;
    case 'save-game': saveGameToLibrary(); break;
    case 'library': openLibraryModal(); break;
    case 'pgn': openPgnModal(); break;
    case 'fen': openFenModal(); break;
    case 'daily': openDailyPuzzle(); break;
    case 'shortcuts': openShortcutsModal(); break;

function confirmResign(){
  if (!state.game || state.game.result){ toast('No active game.', 'warn'); return; }
  showModal({ title:'Resign game?', narrow:true,
    bodyHtml:`<p class="t-body">This will end the game immediately as a loss for ${state.game.turn()==='w'?'White':'Black'}.</p>`,
    actions:[
      {label:'Cancel', kind:'ghost', onClick:(c)=>c()},
      {label:'Resign', kind:'danger', onClick:(c)=>{ c(); resignGame(); }},
    ]});
}
function doUndo(){
  if (!state.game) return;
  if (state.mode==='ai'){

    const humanTurnNow = state.game.turn() !== state.aiSide;
    if (humanTurnNow && state.game.history.length>=2){ state.game.undo(); state.game.undo(); }
    else if (state.game.history.length>=1) state.game.undo();
  } else {
    state.game.undo();
  }
  state.viewPly = state.game.history.length;
  const last = state.game.history[state.game.history.length-1];
  state.lastMove = last?{from:last.move.from,to:last.move.to,capture:!!last.move.captured || last.move.flags==='e'}:null;
  state.result=null;
  detectOpening();
  renderAll();
  saveCurrentGame();
  toast('Move undone.');
}
function doRedo(){
  if (!state.game || !state.game.future.length) return;
  state.game.redo();
  state.viewPly = state.game.history.length;
  const last = state.game.history[state.game.history.length-1];
  state.lastMove = last?{from:last.move.from,to:last.move.to,capture:!!last.move.captured || last.move.flags==='e'}:null;
  detectOpening();
  renderAll();
  saveCurrentGame();
}

let paletteOpen=false, paletteSel=0, paletteFiltered=[];
function openPalette(){
  if (paletteOpen) return;
  paletteOpen=true;
  const scrim = document.createElement('div');
  scrim.className='palette-scrim'; scrim.id='palette-scrim';
  scrim.innerHTML = `
    <div class="palette" role="dialog" aria-label="Command menu">
      <div class="palette-search">
        <span class="ico" data-ico="search"></span>
        <input class="palette-input" id="palette-input" placeholder="Type a command…" autocomplete="off">
      </div>
      <div class="palette-list scroll" id="palette-list"></div>
      <div class="palette-ft"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> select</span><span><kbd>esc</kbd> close</span></div>
    </div>`;
  document.body.appendChild(scrim);
  scrim.querySelectorAll('[data-ico]').forEach(hydrateIcon);
  const input = scrim.querySelector('#palette-input');
  paletteFiltered = COMMANDS.slice(); paletteSel=0;
  renderPaletteList();
  input.focus();
  input.addEventListener('input', ()=>{ filterPalette(input.value); });
  input.addEventListener('keydown', paletteKeyHandler);
  scrim.addEventListener('mousedown', (e)=>{ if (e.target===scrim) closePalette(); });
}
function filterPalette(q){
  const query = q.trim().toLowerCase();
  paletteFiltered = !query ? COMMANDS.slice() : COMMANDS.filter(c=>c.name.toLowerCase().includes(query) || c.group.toLowerCase().includes(query));
  paletteSel=0;
  renderPaletteList();
}
function renderPaletteList(){
  const list = document.getElementById('palette-list');
  if (!list) return;
  if (!paletteFiltered.length){ list.innerHTML = `<div class="palette-empty">No matching commands.</div>`; return; }
  let html=''; let lastGroup=null;
  paletteFiltered.forEach((c,i)=>{
    if (c.group!==lastGroup){ html+=`<div class="palette-group">${c.group}</div>`; lastGroup=c.group; }
    html += `<button class="palette-item${i===paletteSel?' sel':''}" data-idx="${i}"><span class="ico" data-ico="${c.icon}"></span><span class="pi-name">${escapeHtml(c.name)}</span></button>`;
  });
  list.innerHTML = html;
  list.querySelectorAll('[data-ico]').forEach(hydrateIcon);
  list.querySelectorAll('[data-idx]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ runPaletteItem(parseInt(btn.dataset.idx,10)); });
    btn.addEventListener('mouseenter', ()=>{
      paletteSel=parseInt(btn.dataset.idx,10);
      list.querySelector('.palette-item.sel')?.classList.remove('sel');
      btn.classList.add('sel');
    });
  });
  const sel = list.querySelector('.sel'); if (sel) sel.scrollIntoView({block:'nearest'});
}
function runPaletteItem(i){
  const cmd = paletteFiltered[i];
  closePalette();
  if (cmd) cmd.run();
}
function paletteKeyHandler(e){
  if (e.key==='Escape'){ closePalette(); return; }
  if (e.key==='ArrowDown'){ e.preventDefault(); paletteSel=Math.min(paletteSel+1, paletteFiltered.length-1); renderPaletteList(); }
  else if (e.key==='ArrowUp'){ e.preventDefault(); paletteSel=Math.max(paletteSel-1,0); renderPaletteList(); }
  else if (e.key==='Enter'){ e.preventDefault(); runPaletteItem(paletteSel); }
}
function closePalette(){
  const scrim = document.getElementById('palette-scrim');
  if (scrim) scrim.remove();
  paletteOpen=false;
}

      <input class="input" id="ed-ep" placeholder="e.g. e3 or leave blank" value="${pos.ep>=0?sqName(pos.ep):''}">
    </div>
    <div class="errline" id="ed-error" hidden></div>
    <div class="stack-sm">
      <button class="btn btn-block" id="ed-clear">Clear board</button>
      <button class="btn btn-block" id="ed-reset">Reset to start position</button>
      <button class="btn btn-primary btn-block" id="ed-start">Start game from position</button>
      <button class="btn btn-ghost btn-block" id="ed-exit">Exit editor</button>
    </div>
  </div>`;
}
function wireEditorControls(scope){
  scope.querySelectorAll('[data-ico]').forEach(hydrateIcon);
  scope.querySelectorAll('[data-ed-piece]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      scope.querySelectorAll('[data-ed-piece]').forEach(b=>b.setAttribute('aria-pressed','false'));
      btn.setAttribute('aria-pressed','true');
      state.editorSelected = btn.dataset.edPiece || null;
    });
  });
  scope.querySelectorAll('[data-ed-turn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.editorBoard.turn = btn.dataset.edTurn;
      scope.querySelectorAll('[data-ed-turn]').forEach(b=>b.setAttribute('aria-pressed', b===btn));
      renderTurnBadge();
    });
  });
  scope.querySelectorAll('[data-ed-castle]').forEach(cb=>{
    cb.addEventListener('change', ()=>{ state.editorBoard.castling[cb.dataset.edCastle] = cb.checked; });
  });
  scope.querySelector('#ed-ep')?.addEventListener('change', (e)=>{
    const v = e.target.value.trim();
    state.editorBoard.ep = v ? nameToSq(v) : -1;
  });
  scope.querySelector('#ed-clear')?.addEventListener('click', ()=>{
    state.editorBoard.board = new Array(64).fill(null);
    fullBoardRender(false); toast('Board cleared.');
  });
  scope.querySelector('#ed-reset')?.addEventListener('click', ()=>{
    state.editorBoard = new Position(START_FEN);
    renderEditorControls(); fullBoardRender(false); toast('Reset to starting position.');
  });
  scope.querySelector('#ed-start')?.addEventListener('click', ()=>{
    const fen = state.editorBoard.fen();
    const v = Position.validateFen(fen);
    const errEl = scope.querySelector('#ed-error');
    if (!v.ok){ if(errEl){errEl.hidden=false; errEl.innerHTML=`<span class="ico" data-ico="alert"></span>${escapeHtml(v.error)}`; hydrateIcon(errEl.querySelector('[data-ico]'));} toast(v.error,'err'); return; }
    document.getElementById('editor-card')?.remove();
    newGame({ mode:'local', fen });
    setModePill('local');
  });
  scope.querySelector('#ed-exit')?.addEventListener('click', ()=>{
    document.getElementById('editor-card')?.remove();
    setModePill(state.game? state.mode==='editor'? 'local': state.mode : 'local');
    if (state.mode==='editor'){ state.mode='local'; if(!state.game) newGame({mode:'local'}); else renderAll(); }
  });
}
function handleEditorClick(e){
  const sq = squareFromEvent(e);
  if (sq==null) return;
  if (state.editorSelected===null && state.editorBoard.board[sq]){

    state.editorDragFrom = sq; return;
  }
  state.editorBoard.board[sq] = state.editorSelected || null;
  fullBoardRender(false);
}
function startEditorDrag(e, pcEl){
  const sq = parseInt(pcEl.dataset.sq,10);
  e.preventDefault();
  const rect = boardWrapEl.getBoundingClientRect();
  const move = (ev)=>{
    const x=clamp(ev.clientX-rect.left,0,rect.width), y=clamp(ev.clientY-rect.top,0,rect.height);
    pcEl.style.position='absolute'; pcEl.style.left='0'; pcEl.style.top='0';
    pcEl.style.transform = `translate(${x-rect.width/16}px, ${y-rect.height/16}px)`;
  };
  const up = (ev)=>{
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    const x=clamp(ev.clientX-rect.left,0,rect.width-1), y=clamp(ev.clientY-rect.top,0,rect.height-1);
    const col=clamp(Math.floor(x/rect.width*8),0,7), row=clamp(Math.floor(y/rect.height*8),0,7);
    const target = xyToSq(col,row);
    const piece = state.editorBoard.board[sq];
    if (target!==sq){ state.editorBoard.board[sq]=null; state.editorBoard.board[target]=piece; }
    fullBoardRender(false);
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

function setModePill(mode){
  document.querySelectorAll('.mode-pill').forEach(p=>p.setAttribute('aria-selected', p.dataset.mode===mode));
  document.getElementById('card-engine').hidden = mode!=='ai';
  const existing = document.getElementById('editor-card');
  if (mode!=='editor' && existing) existing.remove();
  state.mode = mode;
}
function switchMode(mode){
  if (mode==='editor'){ setModePill('editor'); enterEditorMode(true); syncMobileControls(); return; }
  setModePill(mode);
  if (mode==='ai'){
    openNewGameModal();
  } else if (mode==='local'){
    if (!state.game || state.mode!=='local') newGame({ mode:'local' });
    else { state.mode='local'; }
  } else if (mode==='puzzle'){
    loadPuzzle(state.currentPuzzle || dailyPuzzle());
  } else if (mode==='analysis'){
    state.mode='analysis';
    if (!state.game) newGame({mode:'analysis'});
    renderAll();
  }
  syncMobileControls();
}
function syncMobileControls(){
  const mp = document.getElementById('mpanel-controls');
  if (!mp) return;
  if (state.mode==='editor') return;
  const wrap = document.createElement('div');
  wrap.className = 'stack';
  document.querySelectorAll('.side-l > .card').forEach(card=>{
    const clone = card.cloneNode(true);
    stripIds(clone);
    wrap.appendChild(clone);
  });
  mp.innerHTML=''; mp.appendChild(wrap);
  mp.querySelectorAll('[data-ico]').forEach(hydrateIcon);
  mp.querySelectorAll('[data-cmd]').forEach(btn=>btn.addEventListener('click', ()=>runCmd(btn.dataset.cmd)));
  mp.querySelectorAll('.seg-btn[data-side]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      mp.querySelectorAll('.seg-btn[data-side]').forEach(b=>b.setAttribute('aria-pressed', b===btn));
      document.querySelectorAll('.seg-btn[data-side]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.side===btn.dataset.side));
    });
  });
  const sel = mp.querySelector('[data-role="difficulty-select"]');
  if (sel){ sel.value = state.aiLevel; sel.addEventListener('change', (e)=>{ document.getElementById('sel-difficulty').value = e.target.value; state.aiLevel=e.target.value; }); }
}

function initKeyboardShortcuts(){
  document.addEventListener('keydown', (e)=>{
    const tag = (e.target.tagName||'').toLowerCase();
    const typing = tag==='input' || tag==='textarea' || e.target.isContentEditable;
    if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); paletteOpen? closePalette(): openPalette(); return; }
    if (typing) return;
    if (activeModal) return;
    switch(e.key){
      case 'ArrowLeft': navPrev(); break;
      case 'ArrowRight': navNext(); break;
      case 'Home': navFirst(); break;
      case 'End': navLast(); break;
      case 'z': case 'Z': doUndo(); break;
      case 'y': case 'Y': doRedo(); break;
      case 'f': case 'F': flipBoard(); break;
      case 's': case 'S': toggleSound(); break;
      case 'h': case 'H': showHint(); break;
      case 'a': case 'A': analyzeCurrentPosition(true); break;
      case 'n': case 'N': openNewGameModal(); break;
      case ' ': e.preventDefault(); if(state.clock){ state.clock.active? pauseClock() : startClockFor(state.game.turn()); toast(state.clock.active?'Clock resumed.':'Clock paused.'); } break;
    }
  });
}

function enterFullscreen(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) req.call(el).catch(()=>{});
  document.body.classList.add('fs');
  state.fsActive = true;
  buildFsBar();
}
function exitFullscreenMode(){
  if (document.fullscreenElement) document.exitFullscreen?.();
  document.body.classList.remove('fs');
  state.fsActive = false;
}
function buildFsBar(){
  const bar = document.getElementById('fs-bar');
  bar.innerHTML = `
    <button class="btn btn-sm" data-cmd="undo"><span class="ico" data-ico="undo"></span>Undo</button>
    <button class="btn btn-sm" id="fs-flip"><span class="ico" data-ico="flip"></span>Flip</button>
    <button class="btn btn-sm" id="fs-hint"><span class="ico" data-ico="bulb"></span>Hint</button>
    <button class="btn btn-sm" id="fs-analyze"><span class="ico" data-ico="chart"></span>Analyze</button>`;
  bar.querySelectorAll('[data-ico]').forEach(hydrateIcon);
  bar.querySelector('[data-cmd]').addEventListener('click', doUndo);
  bar.querySelector('#fs-flip').addEventListener('click', flipBoard);
  bar.querySelector('#fs-hint').addEventListener('click', showHint);
  bar.querySelector('#fs-analyze').addEventListener('click', ()=>analyzeCurrentPosition(true));
}
document.addEventListener('fullscreenchange', ()=>{
  if (!document.fullscreenElement && state.fsActive) exitFullscreenMode();
});

function maybeAutoRotate(){
  if (!state.settings.autoRotate || !state.game) return;
  const desired = state.game.turn()==='w' ? 'white':'black';
  if (state.settings.orientation !== desired){
    state.settings.orientation = desired; persistSettings(); fullBoardRender(false); renderClocks();
  }
}

window.addEventListener('error', (e)=>{

  try { toast('Something went wrong — your game state has been preserved.', 'err', 4200); } catch(_){}
});
window.addEventListener('unhandledrejection', (e)=>{

});

function wireTopbar(){
  document.querySelectorAll('.mode-pill').forEach(pill=>{
    pill.addEventListener('click', ()=>switchMode(pill.dataset.mode));
  });
  document.getElementById('btn-palette').addEventListener('click', openPalette);
  document.getElementById('btn-sound').addEventListener('click', toggleSound);
  document.getElementById('btn-flip').addEventListener('click', flipBoard);
  document.getElementById('btn-fullscreen').addEventListener('click', enterFullscreen);
  document.getElementById('btn-fs-exit').addEventListener('click', exitFullscreenMode);
  document.getElementById('btn-stats').addEventListener('click', openStatsModal);
  document.getElementById('btn-settings').addEventListener('click', openSettingsModal);
  document.getElementById('btn-analyze').addEventListener('click', ()=>analyzeCurrentPosition(true));
  const copyPgnBtn = document.getElementById('btn-copy-pgn');
  copyPgnBtn.innerHTML = '<span class="ico" data-ico="export"></span>';
  hydrateIcon(copyPgnBtn.querySelector('[data-ico]'));
  copyPgnBtn.addEventListener('click', copyPgnToClipboard);

  document.querySelectorAll('.navitem[data-cmd]').forEach(btn=>{
    btn.addEventListener('click', ()=>runCmd(btn.dataset.cmd));
  });
  document.querySelectorAll('.seg-btn[data-side]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.seg-btn[data-side]').forEach(b=>b.setAttribute('aria-pressed', b===btn));
    });
  });
  document.getElementById('sel-difficulty').addEventListener('change', (e)=>{ state.aiLevel = e.target.value; });
  wireNavButtons(document);

  document.querySelectorAll('.mtab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.mtab').forEach(t=>t.setAttribute('aria-selected', t===tab));
      const which = tab.dataset.mtab;
      document.getElementById('mpanel-moves').hidden = which!=='moves';
      document.getElementById('mpanel-analysis').hidden = which!=='analysis';
      document.getElementById('mpanel-controls').hidden = which!=='controls';
      document.querySelector('.board-col').hidden = false;
      document.querySelector('.board-col').style.display = which==='board' ? '' : (window.innerWidth<=1080 ? 'none' : '');
    });
  });
}

function initApp(){
  initIcons();
  applyTheme();
  const themeQuery = window.matchMedia('(prefers-color-scheme: dark)');
  themeQuery.addEventListener?.('change', ()=>{ if ((state.settings.appearance||'custom')==='system') applyTheme(); });
  updateSoundButton();
  buildBoardSquares();
  initBoardInteraction();
  wireTopbar();
  initKeyboardShortcuts();

  const restored = restoreCurrentGame();
  if (restored){
    renderAll();
    if (state.mode==='ai' && state.game.turn()===state.aiSide && !state.game.result) scheduleAIMove();
  } else {
    newGame({ mode:'local' });
  }
  setModePill(state.mode);

  document.getElementById('sel-difficulty').value = state.aiLevel || 'intermediate';

  window.addEventListener('resize', debounce(()=>{ fullBoardRender(false); renderClocks(); }, 120));

  setInterval(()=>{ if(state.game && (state.mode==='local'||state.mode==='ai')) saveCurrentGame(); }, 5000);

  setInterval(()=>{
    const c = state.clock;
    if (!c || !c.active || state.result) return;
    const ms = c.active==='w'?c.wMs:c.bMs;
    if (ms>0 && ms<=10000 && Math.floor(ms/1000)!==c._lastWarnSec){
      c._lastWarnSec = Math.floor(ms/1000);
      Audio1.play('lowtime');
    }
  }, 250);
}

if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', initApp);
else initApp();
</script>
